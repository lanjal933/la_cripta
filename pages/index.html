<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Cripta - Dark Fantasy RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'shadow-graphite': '#09070f',
                        'dark-umbra': '#13101c',
                        'neon-violet': '#8b5cf6',
                        'platinum-white': '#f8fafc',
                    },
                    fontFamily: {
                        'title': ['"Cinzel Decorative"', 'serif'],
                        'body': ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    boxShadow: {
                        'violet-glow': '0 0 20px rgba(139, 92, 246, 0.5)',
                        'violet-glow-hover': '0 0 30px rgba(139, 92, 246, 0.8)',
                    }
                }
            }
        }
    </script>
</head>
<body class="font-body text-platinum-white min-h-screen">
    <div id="flashOverlay" class="flash-overlay"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 bg-dark-umbra/90 backdrop-blur-sm border-b border-neon-violet/30 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <a href="index.html" class="font-title text-2xl text-neon-violet hover:text-violet-400 transition-colors">LA CRIPTA</a>
                <div class="flex flex-wrap justify-center gap-6">
                    <a href="mapa.html" class="nav-link text-sm uppercase tracking-wider">Mapa</a>
                    <a href="facciones.html" class="nav-link text-sm uppercase tracking-wider">Facciones</a>
                    <a href="ciudades.html" class="nav-link text-sm uppercase tracking-wider">Ciudades</a>
                    <a href="lore.html" class="nav-link text-sm uppercase tracking-wider">Lore</a>
                    <a href="aventuras.html" class="nav-link text-sm uppercase tracking-wider text-neon-violet font-bold">Aventuras</a>
                    <a href="matchmaking.html" class="nav-link text-sm uppercase tracking-wider">Matchmaking</a>
                    <a href="destino.html" class="nav-link text-sm uppercase tracking-wider">Destino</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="min-h-screen flex flex-col items-center justify-center px-4 py-16 relative overflow-hidden pt-24" style="background-image: url('../images/inicio_pc.png'), url('../images/inicio_responsivo.png'), linear-gradient(to bottom, #09070f, #13101c); background-size: cover, cover, cover; background-position: center, center, center; background-repeat: no-repeat, no-repeat, no-repeat;">
        <div class="absolute inset-0 bg-gradient-to-b from-shadow-graphite/90 via-shadow-graphite/80 to-shadow-graphite/90"></div>
        <div class="relative z-10">
            <h1 class="font-title text-6xl md:text-8xl lg:text-9xl font-black text-center mb-6 tracking-wider drop-shadow-[0_0_30px_rgba(139,92,246,0.6)]">
                LA CRIPTA
            </h1>
            <p class="text-xl md:text-2xl text-neon-violet/80 mb-8 font-light tracking-wide">
                <span id="playerCounter">X</span> Aventureros en la oscuridad
            </p>
            <a href="https://discord.gg/gsdHM8fDeB" target="_blank" class="pulse-violet bg-neon-violet hover:bg-violet-600 text-white font-bold py-4 px-8 rounded-lg text-lg transition-all duration-300 transform hover:scale-105 inline-block">
                Entra al Discord
            </a>
            
            <div class="mt-16 grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl">
                <a href="mapa.html" class="hex-border bg-dark-umbra/90 p-6 text-center hover:shadow-violet-glow-hover transition-all duration-300 cursor-pointer backdrop-blur-sm">
                    <img src="../images/mapa-thumb.jpg" alt="Mapa" class="w-full h-32 object-cover rounded mb-4" onerror="this.style.display='none'">
                    <h3 id="mapaTitle" class="font-title text-xl text-neon-violet mb-2">EXPLORAR MAPA</h3>
                    <p id="mapaDesc" class="text-sm text-gray-400">Descubre los Crypt Planes</p>
                </a>
                <a href="facciones.html" class="hex-border bg-dark-umbra/90 p-6 text-center hover:shadow-violet-glow-hover transition-all duration-300 cursor-pointer backdrop-blur-sm">
                    <img src="../images/facciones-thumb.jpg" alt="Facciones" class="w-full h-32 object-cover rounded mb-4" onerror="this.style.display='none'">
                    <h3 id="faccionesTitle" class="font-title text-xl text-neon-violet mb-2">FACCIONES</h3>
                    <p id="faccionesDesc" class="text-sm text-gray-400">Elige tu alianza</p>
                </a>
                <a href="lore.html" class="hex-border bg-dark-umbra/90 p-6 text-center hover:shadow-violet-glow-hover transition-all duration-300 cursor-pointer backdrop-blur-sm">
                    <img src="../images/lore-thumb.jpg" alt="Lore" class="w-full h-32 object-cover rounded mb-4" onerror="this.style.display='none'">
                    <h3 id="loreTitle" class="font-title text-xl text-neon-violet mb-2">HISTORIA</h3>
                    <p id="loreDesc" class="text-sm text-gray-400">Eras de Secretos</p>
                </a>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('playerCounter').textContent = Math.floor(Math.random() * 500) + 100;

        const K='benjamarcepau9';

        document.addEventListener('keydown',function(e){
            if(e.ctrlKey&&e.altKey&&e.key==='p'){
                window.location.href='admin.html';
            }
        });
    </script>
    <script src="../js/user-menu.js"></script>
</body>
</html>
